<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="app-repo" content="head-office">
<meta name="app-version" content="1.4.3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17110e">
<title>Head Office</title>
<style>
:root{
  --ink:#27222b;--paper:#f4ecd6;--lino:#17110e;--wood:#2a1e17;
  --brain:#7c2f45;--eyes:#1f8f8c;--ears:#c98a12;--nose:#5f8f3a;--mouth:#d9566a;
  --pass:#33313c;--ctl:#34548f;--red:#c8322b;--green:#2f7d4f;
  --ui:"Avenir Next Condensed","DIN Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --type:"American Typewriter","Courier New",Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--lino);color:var(--paper);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.hide{display:none!important}
#app{position:fixed;inset:0;margin:0 auto;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) * 1.5) env(safe-area-inset-right) min(env(safe-area-inset-bottom),8px) env(safe-area-inset-left)}
#bar{flex:none;height:30px;display:flex;align-items:center;gap:8px;padding:0 8px}
#bHome{border:0;background:none;font:600 15px var(--ui);padding:4px 6px 4px 0;color:#cdbfa3}
#ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 16px var(--ui);letter-spacing:.02em}
#ver{font:10px var(--type);opacity:.45}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;position:relative}
#app.wide #stage{justify-content:flex-start}
#app.wide #desk{position:absolute;right:0;bottom:0;height:auto;border-top:2px solid #0d0907;border-left:2px solid #0d0907;border-radius:6px 0 0 0}
#app.wide #home{flex:1;padding:14px 14px 10px;gap:10px}
#app.wide .cal{flex:1;display:flex;flex-direction:column;padding:16px 10px 10px}
#app.wide .grid{flex:1;grid-auto-rows:1fr;gap:3px}
#app.wide .cell{height:auto;min-height:42px}
#app.wide .cell .n{font-size:15px}
#app.wide .cell .ic{width:34px;height:34px;right:4px;bottom:4px}
#app.wide .calHead h2{font-size:32px}
#app.wide .wk{font-size:12px;padding-bottom:5px}
#app.wide .homeBtns button{font-size:16px}
#app.tab #palette{width:168px}
#app.tab #palette .blk{flex:0 1 40px}
#app.tab #ctrl button{height:42px}
#cv{display:block}
#desk{flex:none;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--wood);border-top:2px solid #0d0907}

/* home */
#home{flex:none;overflow:auto;padding:8px 10px 8px;display:flex;flex-direction:column;gap:6px}
.cal{background:var(--paper);color:var(--ink);border-radius:3px;box-shadow:0 2px 0 #b9ab8b,0 8px 18px rgba(0,0,0,.4);padding:13px 7px 7px;position:relative}
.cal .rings{position:absolute;left:14px;right:14px;top:-5px;height:12px;background:radial-gradient(circle at 6px 6px,#d9dde0 0 2.4px,#5d646a 2.6px 3.6px,transparent 3.8px) 0 0/22px 12px repeat-x}
.calHead{display:flex;align-items:baseline;justify-content:space-between;padding:0 3px 4px}
.calHead h2{margin:0;font:800 25px/1 var(--ui);letter-spacing:.16em;color:var(--red)}
.calHead span{font:11.5px var(--type);color:#6b5f4c}
.calHead .mon{display:flex;align-items:center;gap:2px}
.calHead .mon button{border:0;background:none;color:var(--ink);font:700 24px/1 var(--ui);padding:0 6px;opacity:.75}
.calHead .mon button:disabled{opacity:.15}
.calHead h2.spr{color:#2f7d4f}
.cal.turn{animation:turn .35s}
@keyframes turn{40%{transform:rotateX(55deg);opacity:.4}100%{transform:none;opacity:1}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font:700 10px var(--ui);color:#8a7c66;text-align:center;padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{position:relative;height:42px;border:0;background:#fffaf0;box-shadow:inset 0 0 0 1px #d8cbaa;border-radius:1px;padding:2px 3px;text-align:left;color:var(--ink);overflow:hidden}
.cell:active{transform:scale(.96)}
.cell .n{display:block;font:700 11px/1 var(--ui)}
.cell .ic{position:absolute;right:2px;bottom:2px;width:22px;height:22px}
.cell.wkd{background:#f3e7cb}
.cell.lock{opacity:.38}
.cell.lock .ic{filter:grayscale(1)}
.cell.next{box-shadow:inset 0 0 0 2px var(--red);animation:pulse 1.6s infinite}
.cell.done .ic{opacity:.55}
.cell .x{position:absolute;left:3px;top:3px;width:calc(100% - 6px);height:calc(100% - 6px);fill:none;stroke:var(--red);stroke-width:3.4;stroke-linecap:round;opacity:.88}
.cell .x path{stroke-dasharray:46;stroke-dashoffset:0}
.cell.fresh .x path{animation:draw .3s .35s both}.cell.fresh .x path+path{animation-delay:.6s}
.cell.nope{animation:nudge .3s}
.homeBtns{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.homeBtns button{border:0;background:none;color:#cdbfa3;font:600 14px var(--ui);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.homeBtns span{font:11.5px var(--type);color:#8a7c66}
.snd{border:0;background:none;color:#cdbfa3;font:15px var(--ui);padding:4px 5px;line-height:1}
.snd svg{display:block}.snd.off{opacity:.3}.snd.off svg{filter:none}.snd{position:relative}.snd.off:after{content:'';position:absolute;left:4px;right:4px;top:50%;height:2px;background:currentColor;transform:rotate(-40deg)}
#op{position:fixed;inset:0;z-index:60;background:#120b08;cursor:pointer}
#opc{display:block}
#opTap{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;font:600 18px var(--ui);color:var(--paper);letter-spacing:.03em;text-shadow:0 2px 4px rgba(0,0,0,.6);animation:pulse 1.6s infinite}
#opVer{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font:10px var(--type);color:rgba(244,236,214,.5)}
#opTap.faint{opacity:.55;animation:none;font-size:14px}
#tmenu{position:fixed;z-index:45;display:none;flex-direction:column;gap:4px;padding:6px;background:#04140a;border-radius:6px;box-shadow:0 0 0 1px #39ff7a,0 0 14px rgba(57,255,122,.55),0 8px 20px rgba(0,0,0,.6)}
#tmenu.on{display:flex}
#tmenu .blk{height:30px;cursor:pointer}
#tut{position:fixed;z-index:44;overflow:hidden;background:rgba(4,14,8,.94);color:#d9ffe6;font:12px/1.35 "Menlo","Courier New",monospace;padding:8px 10px 7px;border-radius:5px;box-shadow:0 0 0 1px #39ff7a,0 0 16px rgba(57,255,122,.45);pointer-events:auto}
#tut b{color:#39ff7a;font-family:inherit;letter-spacing:0}
#tut .tn{font-size:10px;color:#39ff7a;opacity:.8;margin-bottom:2px}
#tut button{float:right;margin-top:4px;border:0;background:none;color:#8fd6a6;font:11px "Menlo","Courier New",monospace;text-decoration:underline;padding:0}
.tglow{box-shadow:0 0 0 2px #39ff7a,0 0 16px 4px rgba(57,255,122,.7)!important;animation:pulse 1s infinite}
@keyframes draw{from{stroke-dashoffset:46}to{stroke-dashoffset:0}}
/* play */
#play{flex:1;min-height:0;display:flex;flex-direction:column}
#ctrl{flex:none;display:flex;gap:5px;padding:6px 6px 6px}
#ctrl button{flex:1;min-width:0;height:34px;border:0;border-radius:5px;background:#3d2e24;color:var(--paper);font:600 14.5px var(--ui);letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 2px 0 #0d0907}
#ctrl button:active{transform:translateY(1px)}
#ctrl button:disabled{opacity:.32}
#ctrl #bRun{flex:1.45;background:var(--green)}
#work{flex:1;min-height:0;display:flex;gap:6px;padding:0 6px 6px}
#palette{flex:none;width:128px;display:flex;flex-direction:column;gap:3px;overflow:hidden;padding:6px 5px;background:#1b130f;border-radius:5px;box-shadow:inset 0 2px 6px rgba(0,0,0,.65)}
#palette.nudge{animation:nudge .35s}
#work.locked #palette{opacity:.35}
#prog{flex:1;min-width:0;display:flex;flex-direction:column;padding-top:9px;background:var(--paper);border-radius:3px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.45)}
#prog:before{content:"";position:absolute;top:-5px;left:50%;width:66px;height:13px;margin-left:-33px;border-radius:3px 3px 6px 6px;background:linear-gradient(#e3e5e7,#868c92);box-shadow:0 1px 2px rgba(0,0,0,.55);z-index:4}
#rows{flex:1;min-height:0;overflow-y:auto;position:relative;touch-action:pan-y;padding:4px 4px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 31px,#cdd9d8 31px 32px) 0 4px;background-attachment:local}
.row{display:flex;align-items:center;height:32px;position:relative}
.row .num{flex:none;width:23px;text-align:right;padding-right:5px;font:10px var(--type);color:#9a8d73}
.row .ind{flex:none}
.row.cur{background:rgba(255,212,60,.62)}
.row.bad{background:rgba(200,50,43,.3)}
.row.lift{opacity:.22}
.tail{height:64px}
#mark{position:absolute;left:24px;right:6px;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--red);display:none;pointer-events:none;z-index:3}
#insMark{position:absolute;right:8px;height:2px;margin-top:-1px;border-radius:2px;background:#2f9e5a;box-shadow:0 0 6px rgba(47,158,90,.8);pointer-events:none;z-index:2;animation:pulse 1.2s infinite}
#insMark:before{content:'';position:absolute;left:-5px;top:-3px;border:4px solid transparent;border-left:5px solid #2f9e5a}
#wrapNote{position:absolute;left:6px;right:6px;bottom:24px;z-index:5;display:none;align-items:center;justify-content:space-between;gap:6px;padding:5px 6px 5px 9px;background:#27222b;color:var(--paper);border-radius:4px;font:11.5px var(--type);box-shadow:0 4px 12px rgba(0,0,0,.4)}
#wrapNote.on{display:flex}
#wrapNote button{flex:none;border:0;border-radius:3px;background:#5b3f99;color:#fff;font:600 13px var(--ui);padding:5px 9px}
#foot{flex:none;display:flex;justify-content:space-between;padding:3px 8px 4px;font:11px var(--type);color:#7d705a;border-top:1px solid #d5c9ab}

/* label-tape blocks */
.blk{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 7px;border-radius:3px;color:#fff;font:700 13.5px/1 var(--ui);letter-spacing:.06em;white-space:nowrap;touch-action:none;cursor:grab;text-shadow:0 1px 0 rgba(0,0,0,.35);background-image:linear-gradient(to bottom,rgba(255,255,255,.26),rgba(255,255,255,0) 46%,rgba(0,0,0,.2));box-shadow:0 1px 2px rgba(0,0,0,.4)}
#palette .blk{display:flex;height:auto;flex:0 1 28px;min-height:20px}
.blk .who{font-weight:600;font-size:10px;opacity:.82;letter-spacing:.08em}
.blk .to{font-size:10px;opacity:.8}
.t-eyes{background-color:var(--eyes)}.t-ears{background-color:var(--ears)}.t-nose{background-color:var(--nose)}.t-mouth{background-color:var(--mouth)}
.t-brain{background-color:var(--brain)}.t-pass{background-color:var(--pass)}.t-ctl{background-color:var(--ctl)}.t-until{background-color:#5b3f99;font-size:12px;letter-spacing:.02em;gap:3px;padding:0 5px}.t-until .chip{font-size:10.5px;padding:1px 4px 0;min-width:0}
.blk.end{height:20px;font-size:11px;opacity:.72}
.chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;height:19px;padding:1px 6px 0;min-width:30px;border-radius:10px;font:700 11.5px/1 var(--ui);letter-spacing:.05em;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.78);text-shadow:none}
.chip.c-brain{background:var(--brain)}.chip.c-eyes{background:var(--eyes)}.chip.c-ears{background:var(--ears)}.chip.c-nose{background:var(--nose)}.chip.c-mouth{background:var(--mouth)}
.chip.tok{background:var(--paper);color:var(--ink);font-family:var(--type);border-radius:2px;letter-spacing:0;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.chip.unset{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);animation:pulse 1s infinite}
#palette .chip{min-width:18px;padding:1px 5px 0}
#palette .chip.unset{animation:none;background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 22px rgba(0,0,0,.55);opacity:.96}
.ghost.bin{filter:grayscale(.8);opacity:.55}
.ghost .more{font-size:10px;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 5px}
#pick{position:fixed;z-index:40;display:none;gap:6px;flex-wrap:wrap;max-width:310px;padding:8px;background:#17110e;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.16)}
#pick.on{display:flex}
#pick .chip{height:30px;padding:1px 12px 0;font-size:14.5px;border-radius:15px;cursor:pointer}
#pick .chip.tok{border-radius:3px}
#pick .chip.far{opacity:.36}
#pick .chip.off{display:none}

/* paper sheets */
#sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,6,4,.45);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.paper{width:100%;max-height:88%;overflow:auto;background:var(--paper);color:var(--ink);font:13.5px/1.42 var(--type);padding:14px 16px 12px;border-radius:2px;box-shadow:0 10px 30px rgba(0,0,0,.6);position:relative;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.paper h3{margin:0 0 6px;font:700 21px var(--ui);letter-spacing:.01em}
.paper p{margin:0 0 8px}
.paper b{font-family:var(--ui);letter-spacing:.05em}
.paper .meta{font-size:12px;color:#6b5f4c;border-bottom:1px solid #cfc3a5;padding-bottom:6px}
.paper .ps{font-size:12.5px;color:#4d4438}
.stamp{position:absolute;right:14px;top:10px;font:800 15px var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border:3px solid;border-radius:4px;transform:rotate(7deg);opacity:.85}
.stamp.red{color:var(--red)}.stamp.green{color:var(--green)}
.stamp.two{position:static;display:inline-block;transform:rotate(-3deg);font-size:12.5px;margin:2px 0 4px}
.staff{display:grid;grid-template-columns:auto 1fr;gap:6px 9px;font-size:12.5px;line-height:1.35;margin-bottom:8px;align-items:start}
.staff .chip{height:20px}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button{flex:1;height:38px;border:0;border-radius:4px;background:var(--ink);color:var(--paper);font:600 15.5px var(--ui);letter-spacing:.02em}
.btns button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.45}}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div id="app">
  <header id="bar"><button id="bHome" class="hide">&lsaquo; Calendar</button><div id="ttl"></div><button id="bMus" class="snd" aria-label="Music"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M8 4.5l8-2.2v10.8a2.6 2.1 0 1 1-1.7-2V5.6L9.7 6.9v8.3a2.6 2.1 0 1 1-1.7-2z" fill="currentColor"/></svg></button><button id="bSfx" class="snd" aria-label="Sound effects and speech"><svg viewBox="0 0 20 20" width="19" height="19"><path d="M3 7.5h3.2L10.5 4v12l-4.3-3.5H3z" fill="currentColor"/><path d="M13.2 7.2q1.8 2.8 0 5.6M15.6 5q3.6 5 0 10" stroke="currentColor" fill="none" stroke-width="1.7" stroke-linecap="round"/></svg></button><div id="ver"></div></header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <main id="desk">
    <section id="home">
      <div class="cal"><div class="rings"></div>
        <div class="calHead"><div class="mon"><button id="mPrev" aria-label="Previous month">&lsaquo;</button><h2 id="calMon">Smarch</h2><button id="mNext" aria-label="Next month">&rsaquo;</button></div><span id="calSub"></span></div>
        <div class="wk"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div id="days" class="grid"></div>
      </div>
      <div class="homeBtns"><button id="bIntro">Watch the opening titles</button><button id="bTut">How to play</button></div>
    </section>
    <section id="play" class="hide">
      <div id="ctrl">
        <button id="bRun">Run</button><button id="bStep">Step</button><button id="bStop">Stop</button><button id="bSpd">1&times;</button><button id="bMemo">Memo</button><button id="bStaff">Staff</button><button id="bClr">Clear</button>
      </div>
      <div id="work">
        <div id="palette"></div>
        <div id="prog"><div id="rows"></div><div id="foot"></div></div>
      </div>
    </section>
  </main>
  <div id="sheet" class="hide"><div class="paper"><div id="sheetBody"></div><div class="btns" id="sheetBtns"></div></div></div>
</div>
<div id="pick"></div>
<div id="op"><canvas id="opc"></canvas><div id="opTap">Tap to start</div><div id="opVer"></div></div>
<div id="mark"></div>

<script id="logic">
/* Head Office: rules, levels and interpreter. No DOM in here, so it can be tested headless. */
var HO=(function(){
'use strict';
var TECHS=['brain','eyes','ears','nose','mouth'];
var NAMES={brain:'BRIAN',eyes:'IRIS',ears:'AUDREY',nose:'OLLY',mouth:'BUD'};
var SENSES={LOOK:'eyes',LISTEN:'ears',SNIFF:'nose',TASTE:'mouth'};
var FOOD={FISH:1,CHEESE:1,SOUP:1,TOAST:1,JAM:1,PIE:1,CHIPS:1,MUFFIN:1,LEMON:1,GRAVY:1,CHOCOLATE:1,CARROT:1};
var TUBES=['brain-eyes','brain-ears','eyes-ears','eyes-nose','ears-mouth','nose-mouth','brain-mouth'];
function garble(t){return t.replace(/A/g,'U');}
function tubeKey(a,b){return TECHS.indexOf(a)<TECHS.indexOf(b)?a+'-'+b:b+'-'+a;}
function rng(seed){var a=(seed>>>0)||1;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function no(text){return {ok:false,text:text};}

var FISH={key:'fish',d:3,icon:'\ud83d\udc1f',title:'The ringing fish',blurb:'The desk is ringing.',
 re:'The desk is ringing',
 brief:['Something on the desk is ringing. Find out what it is and have the body <b>GRAB</b> it. Then <b>SAY</b> back whatever it says.','I act on the memo in my hands and nothing else, so somebody will need to send me one.'],
 ps:['Audrey’s tube to my office is blocked. There is a sandwich in it. Nobody has come forward.'],
 palette:['LOOK','LISTEN','PASS','GRAB','SAY'],blocked:{'brain-ears':1,'brain-mouth':1},tokens:[],par:7,cases:1,
 win:'The fish says it is for Olly. Olly is not taking calls.',
 make:function(){
  var s={grabbed:false,done:false};
  return {s:s,
   sense:function(t){return t==='eyes'?'FISH':t==='ears'?(s.grabbed?'HELLO?':'RING'):t==='nose'?'FISH':'DESK';},
   act:function(v,k){
    if(v==='GRAB'){
     if(s.grabbed)return no('The body was already holding the fish. It tried to grab “'+k+'” as well, and now the fish is on the floor.');
     if(k==='FISH'){s.grabbed=true;return {ok:true,fx:'grab'};}
     if(k==='RING')return no('The body tried to grab a “RING”. You cannot grab a noise. Brian has been told this before.');
     return no('The body tried to grab “'+k+'”. There is no '+k+' on the desk.');
    }
    if(!s.grabbed)return no('The body said “'+k+'” at a fish it had not picked up. The fish kept ringing.');
    if(k==='HELLO?'){s.done=true;return {ok:true,done:true,fx:'say'};}
    if(k==='RING')return no('The body said “RING” into the fish. The fish said that was its line, and hung up.');
    if(k==='FISH')return no('The body said “FISH” into the fish. The fish said “speaking”, and hung up.');
    return no('The body said “'+k+'” into the fish. The fish hung up.');
   }};
 }};
var CHEESE={key:'cheese',d:9,icon:'\ud83e\uddc0',title:'Cheese or soap',blurb:'The canteen has cubes again.',
 re:'Canteen',
 brief:['The canteen is serving yellow cubes again. Each cube is <b>CHEESE</b> or <b>SOAP</b>. They look the same.','The body must <b>EAT</b> cheese and <b>WASH</b> with soap. Two trays today. HR would like both of them right.'],

function link(rows){var m=[],st=[];for(var i=0;i<rows.length;i++){var o=rows[i].op;if(o==='IF'||o==='REPEAT'||o==='UNTIL')st.push(i);else if(o==='END'){var j=st.pop();if(j===undefined)return null;m[i]=j;m[j]=i;}}return st.length?null:m;}

function count(rows){var n=0;for(var i=0;i<rows.length;i++)if(rows[i].op!=='END')n++;return n;}
function preview(level,seed,ci){return JSON.parse(JSON.stringify(level.make(seed,ci||0).s));}

function createRun(level,rows,seed,ci){

   if(st.pc>=rows.length)return fail(-1,'ended','The procedure finished. The job did not. The body is just standing there.'+hold);
   var i=st.pc,r=rows[i],o=r.op;
   if(o==='REPEAT'){st.pc++;continue;}
   if(o==='END'){var j=m[i];st.pc=(j!==undefined&&rows[j].op==='REPEAT')?j+1:(j!==undefined&&rows[j].op==='UNTIL')?j:i+1;continue;}
   st.steps++;
   if(SENSES[o]){
    var who=SENSES[o],tok=world.sense(who),had=st.hands[who],ate=false;
    st.hands[who]=tok;
    if(who==='mouth'&&FOOD[tok]){st.hands.mouth=null;ate=true;}
    st.pc++;
    return {row:i,ev:{t:'sense',who:who,token:tok,eaten:ate,had:had},status:'run',view:view()};
   }
   if(o==='PASS'){
    var a=r.a,b=r.b,key=tubeKey(a,b),A=NAMES[a],B=NAMES[b];
    if(a===b)return fail(i,'self',A+' passed a memo to '+A+'. Technically nothing went wrong. Brian disagrees.',{from:a,to:b});
    if(TUBES.indexOf(key)<0)return fail(i,'notube','There is no tube between '+A+' and '+B+'. The memo hit the wall and slid down it.',{from:a,to:b});
    if(blocked[key])return fail(i,'blocked','The tube between '+A+' and '+B+' is out of order. So, now, is the memo.',{from:a,to:b});
    if(st.hands[a]==null)return fail(i,'empty',A+' had nothing to pass, and passed it anyway. '+B+' is holding an imaginary memo and feels patronised.',{from:a,to:b});
    var t0=st.hands[a],got=t0,gar=false,eat=false,had2=st.hands[b];
    st.hands[a]=null;
    if(b==='ears'){got=garble(t0);gar=got!==t0;}
    if(b==='mouth'&&FOOD[got]){eat=true;st.hands[b]=null;}else st.hands[b]=got;
    st.pc++;
    return {row:i,ev:{t:'pass',from:a,to:b,token:t0,got:got,garbled:gar,eaten:eat,had:had2},status:'run',view:view()};
   }
   if(o==='IF'||o==='UNTIL'){
    var h=st.hands[r.a],yes=r.b==='ANYTHING'?h!=null:r.b==='NOTHING'?h==null:h===r.b;
    if(o==='UNTIL')st.pc=yes?(m[i]!==undefined?m[i]+1:i+1):i+1;else st.pc=yes?i+1:(m[i]!==undefined?m[i]+1:i+1);
    return {row:i,ev:{t:'if',who:r.a,want:r.b,yes:yes,has:h},status:'run',view:view()};
   }
   var k=st.hands.brain;
   if(k==null)return fail(i,'nomemo','Brian tried to '+o+' with no memo in his hands. He has acted decisively on no information. Again.',{verb:o});
   st.hands.brain=null;
   var res=world.act(o,k);

   if(!res.ok){st.status='fail';return {row:i,ev:{t:'act',verb:o,token:k,ok:false,text:res.text},status:'fail',view:view()};}
   if(res.done)st.status='win';
   return {row:i,ev:{t:'act',verb:o,token:k,ok:true,done:!!res.done,fx:res.fx},status:st.status,view:view()};

 return {step:step,view:view,hands:st.hands,state:st};
}
